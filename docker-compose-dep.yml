version: "3.8"

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    profiles: [ "search" ]
    env_file:
      - .env
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    networks:
      - omisys-network
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip \
            --in config/certs/instances.yml \
            --ca-cert config/certs/ca/ca.crt \
            --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 {} \;;
        find . -type f -exec chmod 640 {} \;;
        echo "Certs ready.";
      '
    healthcheck:
      test: [ "CMD-SHELL", "[ -f config/certs/es01/es01.crt ]" ]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    profiles: [ "search" ]
    restart: always
    env_file:
      - .env
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      # HTTP 는 평문으로 둔다. 9200 은 보안그룹에서 닫혀 있고 SSH 터널로만 닿으므로
      # 전송 암호화는 터널이 이미 제공한다. 비밀번호 인증(security.enabled)은 유지한다.
      # HTTPS 로 두면 클라이언트마다 자체서명 CA 를 신뢰시켜야 해서 로컬 개발이 번거롭다.
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    # 힙 1g 에 Lucene mmap·스레드 스택 등 off-heap 이 더해진다.
    # 1600m 으로는 실측 93% 까지 차서 OOM-Kill 위험이 있었다. 힙의 2.5배로 잡는다.
    mem_limit: 2560m
    networks:
      - omisys-network
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kafka:
    container_name: kafka
    image: apache/kafka:3.8.1
    restart: always
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - omisys-network
    mem_limit: 800m

  cart-cache:
    container_name: cart-cache
    image: redis:7.4.0
    ports:
      - "6379:6379"
    volumes:
      - redis-cart-data:/data
    restart: always
    networks:
      - omisys-network
    mem_limit: 80m

  product-cache:
    container_name: product-cache
    image: redis:7.4.0
    ports:
      - "6380:6380"
    command: [ "redis-server", "--port", "6380" ]
    volumes:
      - redis-product-data:/data
    restart: always
    networks:
      - omisys-network
    mem_limit: 80m

  coupon-cache:
    container_name: coupon-cache
    image: redis:7.4.0
    ports:
      - "6381:6381"
    command: [ "redis-server", "--port", "6381" ]
    volumes:
      - redis-coupon-data:/data
    restart: always
    networks:
      - omisys-network
    mem_limit: 80m

  gateway-cache:
    container_name: gateway-cache
    image: redis:7.4.0
    ports:
      - "6382:6382"
    command: [ "redis-server", "--port", "6382" ]
    volumes:
      - redis-gateway-data:/data
    restart: always
    networks:
      - omisys-network
    mem_limit: 80m

  auth-cache:
    container_name: auth-cache
    image: redis:7.4.0
    ports:
      - "6383:6383"
    command: [ "redis-server", "--port", "6383" ]
    volumes:
      - redis-auth-data:/data
    restart: always
    networks:
      - omisys-network
    mem_limit: 80m

  omisys-mysql:
    image: mysql:8.0
    container_name: omisys-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # 최초 기동 시 01-init-schemas.sh 가 아래 값으로 스키마와 계정을 만든다.
      # 앱 서비스(docker-compose.yml)와 같은 변수라 .env 한 벌로 맞춰진다.
      USER_MYSQL_DATABASE: ${USER_MYSQL_DATABASE}
      USER_MYSQL_USER: ${USER_MYSQL_USER}
      USER_MYSQL_PASSWORD: ${USER_MYSQL_PASSWORD}
      PRODUCT_MYSQL_DATABASE: ${PRODUCT_MYSQL_DATABASE}
      PRODUCT_MYSQL_USER: ${PRODUCT_MYSQL_USER}
      PRODUCT_MYSQL_PASSWORD: ${PRODUCT_MYSQL_PASSWORD}
      ORDER_MYSQL_DATABASE: ${ORDER_MYSQL_DATABASE}
      ORDER_MYSQL_USER: ${ORDER_MYSQL_USER}
      ORDER_MYSQL_PASSWORD: ${ORDER_MYSQL_PASSWORD}
      PAYMENT_MYSQL_DATABASE: ${PAYMENT_MYSQL_DATABASE}
      PAYMENT_MYSQL_USER: ${PAYMENT_MYSQL_USER}
      PAYMENT_MYSQL_PASSWORD: ${PAYMENT_MYSQL_PASSWORD}
      PROMOTION_MYSQL_DATABASE: ${PROMOTION_MYSQL_DATABASE}
      PROMOTION_MYSQL_USER: ${PROMOTION_MYSQL_USER}
      PROMOTION_MYSQL_PASSWORD: ${PROMOTION_MYSQL_PASSWORD}
      REVIEW_MYSQL_DATABASE: ${REVIEW_MYSQL_DATABASE}
      REVIEW_MYSQL_USER: ${REVIEW_MYSQL_USER}
      REVIEW_MYSQL_PASSWORD: ${REVIEW_MYSQL_PASSWORD}
      NOTIFICATION_MYSQL_DATABASE: ${NOTIFICATION_MYSQL_DATABASE}
      NOTIFICATION_MYSQL_USER: ${NOTIFICATION_MYSQL_USER}
      NOTIFICATION_MYSQL_PASSWORD: ${NOTIFICATION_MYSQL_PASSWORD}
      DELIVERY_MYSQL_DATABASE: ${DELIVERY_MYSQL_DATABASE}
      DELIVERY_MYSQL_USER: ${DELIVERY_MYSQL_USER}
      DELIVERY_MYSQL_PASSWORD: ${DELIVERY_MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=512M
      --max-connections=200
      --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/migrations/mysql/01-init-schemas.sh:/docker-entrypoint-initdb.d/01-init-schemas.sh:ro
    networks:
      - omisys-network
    mem_limit: 900m

volumes:
  redis-cart-data:
    driver: local
  redis-product-data:
    driver: local
  redis-coupon-data:
    driver: local
  redis-gateway-data:
    driver: local
  redis-auth-data:
    driver: local
  certs:
    driver: local
  esdata01:
    driver: local
  kafka-data:
    driver: local
  mysql-data:
    driver: local

networks:
  omisys-network:
    external: true
